<aside
  class="chat-sessions"
  [class.chat-sessions--open]="mobileOpen()"
  [attr.aria-label]="i18n.t('chat.sessions.title')"
>
  <div class="chat-sessions__header">
    <div class="chat-sessions__header-row">
      <h2 class="chat-sessions__title">{{ i18n.t('chat.sessions.title') }}</h2>
      <button
        type="button"
        class="chat-sessions__close"
        [attr.aria-label]="i18n.t('chat.sessions.hide')"
        (click)="onClose()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </button>
    </div>
    <button type="button" class="chat-sessions__new" (click)="onCreate()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>{{ i18n.t('chat.sessions.newChat') }}</span>
    </button>
  </div>

  <ul class="chat-sessions__list">
    @if (sessionsStore.sessions().length === 0) {
      <li class="chat-sessions__empty">
        <p>{{ i18n.t('chat.sessions.empty') }}</p>
      </li>
    }
    @for (session of sessionsStore.sessions(); track session.id) {
      <li class="chat-sessions__row">
        <button
          type="button"
          class="chat-sessions__item"
          [class.chat-sessions__item--active]="sessionsStore.activeSessionId() === session.id"
          (click)="onSelect(session.id)"
        >
          <span class="chat-sessions__item-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </span>
          <span class="chat-sessions__item-body">
            <span class="chat-sessions__item-title" [attr.title]="sessionTitle(session.title)">
              <span class="chat-sessions__item-title-text" appMarqueeOnHover>{{
                sessionTitle(session.title)
              }}</span>
            </span>
            <span class="chat-sessions__item-meta">
              {{ session.messages.length }} {{ i18n.t('chat.sessions.messages') }}
            </span>
          </span>
        </button>
        <button
          type="button"
          class="chat-sessions__delete"
          [attr.aria-label]="i18n.t('chat.sessions.delete')"
          (click)="onDelete($event, session.id)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
          </svg>
        </button>
      </li>
    }
  </ul>
</aside>
