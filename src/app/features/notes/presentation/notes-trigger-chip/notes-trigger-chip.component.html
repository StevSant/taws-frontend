<button type="button" class="notes-trigger-chip" (click)="open()">
  <span class="notes-trigger-chip__glyph" aria-hidden="true">✎</span>
  @if (count() > 0) {
    <span
      >{{ count() }}
      {{ count() === 1 ? i18n.t('notes.trigger.note') : i18n.t('notes.trigger.notes') }}</span
    >
  } @else {
    <span>{{ i18n.t('notes.trigger.add') }}</span>
  }
</button>
