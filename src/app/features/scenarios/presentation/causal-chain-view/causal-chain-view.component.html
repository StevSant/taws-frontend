<div class="causal-chain">
  <p class="causal-chain__hint">{{ i18n.t('scenarios.result.chain.interactionHint') }}</p>

  @if (chain.edges.length === 0) {
    <p class="causal-chain__empty">{{ i18n.t('scenarios.result.chain.empty') }}</p>
  } @else {
    <ol class="causal-chain__timeline">
      @for (edge of chain.edges; track $index; let i = $index) {
        <li
          class="causal-chain__step"
          [class.causal-chain__step--highlighted]="
            selectedNodeId() !== null && edgeInvolves(edge, selectedNodeId()!)
          "
          [class.causal-chain__step--dimmed]="
            selectedNodeId() !== null && !edgeInvolves(edge, selectedNodeId()!)
          "
        >
          <span class="causal-chain__step-num">{{ i + 1 }}</span>
          <div class="causal-chain__step-body">
            <div class="causal-chain__nodes">
              <button
                type="button"
                class="causal-chain__node"
                [class.causal-chain__node--selected]="selectedNodeId() === edge.sourceNodeId"
                (click)="onToggleNode(edge.sourceNodeId)"
              >
                {{ nodeLabel(edge.sourceNodeId) }}
              </button>
              <span class="causal-chain__arrow" aria-hidden="true">→</span>
              <button
                type="button"
                class="causal-chain__node"
                [class.causal-chain__node--selected]="selectedNodeId() === edge.targetNodeId"
                (click)="onToggleNode(edge.targetNodeId)"
              >
                {{ nodeLabel(edge.targetNodeId) }}
              </button>
            </div>
            <button
              type="button"
              class="causal-chain__mechanism"
              [class.causal-chain__mechanism--expanded]="expandedEdgeIndex() === i"
              (click)="onToggleEdge(i)"
            >
              <span class="causal-chain__mechanism-text">{{ edge.mechanism }}</span>
              <span class="causal-chain__mechanism-confidence">{{
                edge.confidence | percent: '1.0-0'
              }}</span>
            </button>
          </div>
        </li>
      }
    </ol>
  }
</div>
