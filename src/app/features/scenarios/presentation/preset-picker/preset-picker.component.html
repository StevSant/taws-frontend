<div class="preset-picker" role="radiogroup" [attr.aria-label]="i18n.t('scenarios.mode.preset')">
  @for (preset of presets; track preset.id) {
    <button
      type="button"
      class="preset-picker__card"
      role="radio"
      [attr.aria-checked]="preset.id === selectedId"
      [class.preset-picker__card--selected]="preset.id === selectedId"
      (click)="onSelect(preset)"
    >
      @if (preset.id === selectedId) {
        <span class="preset-picker__check" aria-hidden="true">✓</span>
      }
      <span class="preset-picker__icon" aria-hidden="true">
        @switch (presetIcon(preset)) {
          @case ('trending-down') {
            <svg lucideTrendingDown [size]="16"></svg>
          }
          @case ('trending-up') {
            <svg lucideTrendingUp [size]="16"></svg>
          }
          @case ('droplet') {
            <svg lucideDroplet [size]="16"></svg>
          }
          @case ('shield-alert') {
            <svg lucideShieldAlert [size]="16"></svg>
          }
          @case ('percent') {
            <svg lucidePercent [size]="16"></svg>
          }
          @case ('file-warning') {
            <svg lucideFileWarning [size]="16"></svg>
          }
          @case ('gavel') {
            <svg lucideGavel [size]="16"></svg>
          }
          @default {
            <svg lucideSparkles [size]="16"></svg>
          }
        }
      </span>
      <span class="preset-picker__title">{{ title(preset) }}</span>
      <span class="preset-picker__description">{{ description(preset) }}</span>
      <span class="preset-picker__meta">
        <span class="preset-picker__badge preset-picker__badge--magnitude">
          {{ magnitudeLabel(preset.magnitude) }}
        </span>
        <span class="preset-picker__badge preset-picker__badge--horizon">
          {{ horizonLabel(preset.horizon) }}
        </span>
      </span>
      <span class="preset-picker__assets">
        @for (assetClass of preset.affectedAssetClasses; track assetClass) {
          <span class="preset-picker__asset-chip">{{ assetClassLabel(assetClass) }}</span>
        }
      </span>
    </button>
  }
</div>
