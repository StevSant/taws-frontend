<section class="asset-class-section">
  <header class="asset-class-section__header">
    <h2 class="asset-class-section__title">{{ label }}</h2>
    <span class="asset-class-section__count">
      {{ segment.signals.length }} {{ i18n.t('radar.landscape.instruments') }}
    </span>
  </header>

  <div class="asset-class-section__panels">
    <app-radar-market-pulse
      [distribution]="segment.landscape.distribution"
      [marketScore]="segment.marketScore"
    />
    <app-radar-market-score [marketScore]="segment.marketScore" />
  </div>
</section>
