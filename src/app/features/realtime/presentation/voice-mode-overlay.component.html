<div
  class="voice-mode"
  [class.voice-mode--reduced-motion]="reducedMotion()"
  [class.voice-mode--connecting]="isConnecting()"
  [class.voice-mode--live]="isLive()"
  [class.voice-mode--speaking]="isModelSpeaking()"
  [class.voice-mode--offline]="isNotAvailable() || isError()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="i18n.t('chat.realtime.overlayLabel')"
  (keydown)="onKeydown($event)"
>
  <button
    type="button"
    class="voice-mode__backdrop"
    tabindex="-1"
    [attr.aria-label]="i18n.t('chat.realtime.close')"
    (click)="requestClose()"
  ></button>

  <div class="voice-mode__panel">
    <button
      type="button"
      class="voice-mode__dismiss"
      [attr.aria-label]="i18n.t('chat.realtime.close')"
      (click)="requestClose()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    @if (isNotAvailable()) {
      <div class="voice-mode__notice" role="status">
        <span class="voice-mode__notice-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z" />
            <path d="M12 8v5M12 16.5h.01" />
          </svg>
        </span>
        <h2 class="voice-mode__notice-title">{{ i18n.t('chat.realtime.notAvailableTitle') }}</h2>
        <p class="voice-mode__notice-text">{{ i18n.t('chat.realtime.notAvailable') }}</p>
      </div>
    } @else {
      <div class="voice-mode__orb" aria-hidden="true">
        <span class="voice-mode__corona-glow"></span>
        <span class="voice-mode__corona-ring">
          <span class="voice-mode__corona-ring-track"></span>
        </span>
        <app-golden-polyhedron [size]="orbSize" [activity]="orbActivity()" />
      </div>

      <p class="voice-mode__status" role="status" aria-live="polite">
        <span class="voice-mode__status-dot" aria-hidden="true"></span>
        {{ statusLabel() }}
      </p>

      <div class="voice-mode__transcript-wrap">
        <p
          class="voice-mode__transcript"
          [class.voice-mode__transcript--empty]="!liveTranscript()"
          [attr.aria-label]="i18n.t('chat.realtime.transcriptLabel')"
          aria-live="polite"
          aria-atomic="false"
        >
          {{ liveTranscript() || i18n.t('chat.realtime.transcriptEmpty') }}
        </p>
      </div>
    }

    <button #endButton type="button" class="voice-mode__end" (click)="requestClose()">
      @if (isNotAvailable() || isError()) {
        {{ i18n.t('chat.realtime.close') }}
      } @else {
        <span class="voice-mode__end-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </span>
        {{ i18n.t('chat.realtime.end') }}
      }
    </button>
  </div>
</div>
