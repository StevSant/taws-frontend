@if (available()) {
  <button
    #trigger
    type="button"
    class="talk-trigger"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-expanded]="overlayOpen()"
    [attr.aria-label]="i18n.t('chat.realtime.talkCta')"
    (click)="open()"
  >
    <span class="talk-trigger__wave" aria-hidden="true">
      <span class="talk-trigger__bar"></span>
      <span class="talk-trigger__bar"></span>
      <span class="talk-trigger__bar"></span>
      <span class="talk-trigger__bar"></span>
      <span class="talk-trigger__bar"></span>
    </span>
    <span class="talk-trigger__label">{{ i18n.t('chat.realtime.talkCta') }}</span>
  </button>

  @if (overlayOpen()) {
    <app-voice-mode-overlay
      [connectionState]="connectionState()"
      [liveTranscript]="liveTranscript()"
      [isModelSpeaking]="isModelSpeaking()"
      [activeToolCall]="activeToolCall()"
      [permissionDenied]="permissionDenied()"
      [reducedMotion]="reducedMotion()"
      (close)="close()"
    />
  }
}
