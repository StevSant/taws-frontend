<div class="app-shell">
  <header class="app-shell__header">
    <a class="app-shell__brand" routerLink="/radar">
      <app-midas-logo class="app-shell__brand-mark" [size]="26" />
      <span class="app-shell__brand-name">{{ i18n.t('shell.brand') }}</span>
    </a>

    <nav class="app-shell__nav" [attr.aria-label]="i18n.t('shell.nav.label')">
      <a
        class="app-shell__nav-link"
        routerLink="/radar"
        routerLinkActive="app-shell__nav-link--active"
        >{{ i18n.t('shell.nav.radar') }}</a
      >
      <a
        class="app-shell__nav-link"
        routerLink="/chat"
        routerLinkActive="app-shell__nav-link--active"
        >{{ i18n.t('shell.nav.chat') }}</a
      >
      <a
        class="app-shell__nav-link"
        routerLink="/scenarios"
        routerLinkActive="app-shell__nav-link--active"
        >{{ i18n.t('shell.nav.scenarios') }}</a
      >
      <a
        class="app-shell__nav-link"
        routerLink="/briefings"
        routerLinkActive="app-shell__nav-link--active"
        >{{ i18n.t('shell.nav.briefings') }}</a
      >
    </nav>

    <div class="app-shell__cluster">
      <app-notification-bell
        [notifications]="notifications.notifications()"
        (dismiss)="notifications.dismiss($event)"
        (clearAll)="notifications.clearAll()"
      />

      <app-telegram-link-panel [isAuthenticated]="auth.isAuthenticated()" />

      <app-theme-toggle />
      <app-language-toggle />

      @if (auth.isAuthenticated()) {
        <button type="button" class="app-shell__auth-btn" (click)="logout()">
          {{ i18n.t('shell.auth.logout') }}
        </button>
      } @else {
        <a class="app-shell__auth-btn" routerLink="/login">{{ i18n.t('shell.auth.login') }}</a>
      }
    </div>
  </header>

  <main class="app-shell__content">
    <router-outlet></router-outlet>
  </main>
</div>
