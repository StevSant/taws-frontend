<nav class="pagination" aria-label="pagination">
  <button type="button" class="pagination__button" [disabled]="isFirst" (click)="previous()">
    ← {{ i18n.t('pagination.previous') }}
  </button>

  <span class="pagination__status" aria-live="polite">
    {{ i18n.t('pagination.page') }} {{ page }} {{ i18n.t('pagination.of') }} {{ totalPages }}
  </span>

  <button type="button" class="pagination__button" [disabled]="isLast" (click)="next()">
    {{ i18n.t('pagination.next') }} →
  </button>
</nav>
