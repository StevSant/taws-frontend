<div class="theme-toggle" [class.theme-toggle--open]="isOpen()">
  <button
    type="button"
    class="theme-toggle__trigger"
    [attr.aria-label]="i18n.t('shell.theme.toggleLabel')"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="true"
    (click)="toggle()"
  >
    @if (themes.theme() === 'dark') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
    }
  </button>

  @if (isOpen()) {
    <div
      class="theme-toggle__menu"
      role="menu"
      [style.top.px]="menuAnchor().top"
      [style.left.px]="menuAnchor().left"
    >
      @if (themes.theme() === 'dark') {
        <button
          type="button"
          class="theme-toggle__option"
          role="menuitem"
          [attr.aria-label]="i18n.t('shell.theme.light')"
          (click)="selectTheme('light')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
        </button>
      } @else {
        <button
          type="button"
          class="theme-toggle__option"
          role="menuitem"
          [attr.aria-label]="i18n.t('shell.theme.dark')"
          (click)="selectTheme('dark')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
          </svg>
        </button>
      }
    </div>
  }
</div>
