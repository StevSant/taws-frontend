<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="
    themes.theme() === 'dark' ? i18n.t('shell.theme.light') : i18n.t('shell.theme.dark')
  "
  (click)="toggleTheme()"
>
  @if (themes.theme() === 'dark') {
    <svg lucideSun [size]="16" [strokeWidth]="1.8" aria-hidden="true"></svg>
  } @else {
    <svg lucideMoon [size]="16" [strokeWidth]="1.8" aria-hidden="true"></svg>
  }
</button>
