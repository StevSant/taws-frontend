<div class="language-toggle" [class.language-toggle--open]="isOpen()">
  <button
    type="button"
    class="language-toggle__trigger"
    [attr.aria-label]="i18n.t('shell.language.toggleLabel')"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="true"
    (click)="toggle()"
  >
    {{ currentLabel() }}
  </button>

  @if (isOpen()) {
    <div
      class="language-toggle__menu"
      role="menu"
      [style.top.px]="menuAnchor().top"
      [style.left.px]="menuAnchor().left"
    >
      <button
        type="button"
        class="language-toggle__option"
        role="menuitem"
        [attr.aria-label]="alternateLabel()"
        (click)="selectLocale(alternateLocale())"
      >
        {{ alternateLabel() }}
      </button>
    </div>
  }
</div>
