<svg
  class="macro-spark"
  [class.macro-spark--up]="trend === 'up'"
  [class.macro-spark--down]="trend === 'down'"
  [class.macro-spark--flat]="trend === 'flat'"
  viewBox="0 0 64 24"
  aria-hidden="true"
>
  @if (trend === 'up') {
    <polyline points="2,18 16,14 28,16 40,10 52,8 62,4" />
  } @else if (trend === 'down') {
    <polyline points="2,6 16,10 28,9 40,14 52,16 62,18" />
  } @else {
    <polyline points="2,12 62,12" />
  }
</svg>
