<svg
  class="neural-orb"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 40 40"
  role="img"
  aria-hidden="true"
>
  <defs>
    <radialGradient [attr.id]="uid + '-core-grad'" cx="50%" cy="50%" r="50%">
      <stop offset="0%" [attr.stop-color]="'var(--color-gold-bright)'" />
      <stop offset="100%" [attr.stop-color]="'var(--color-gold)'" />
    </radialGradient>
    <filter [attr.id]="uid + '-glow'" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle class="neural-orb__ring" cx="20" cy="20" r="17" />

  <g class="neural-orb__mesh">
    @for (edge of edges; track $index) {
      <line [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2" />
    }
    @for (node of nodes; track $index) {
      <line x1="20" y1="20" [attr.x2]="node.x" [attr.y2]="node.y" />
    }
    @for (node of nodes; track $index) {
      <circle class="neural-orb__node" [attr.cx]="node.x" [attr.cy]="node.y" r="1.6" />
    }
  </g>

  <circle
    class="neural-orb__core"
    cx="20"
    cy="20"
    r="5"
    [attr.fill]="'url(#' + uid + '-core-grad)'"
    [attr.filter]="'url(#' + uid + '-glow)'"
  />
</svg>
